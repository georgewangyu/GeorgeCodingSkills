name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 skills/principles-bitter-lesson/scripts/bitter_lesson.py check --root .
      - run: python3 -m unittest discover -s skills/principles-bitter-lesson/tests
