name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 skills/principles-bitter-lesson/scripts/bitter_lesson.py check --root .
      - run: python3 -m unittest discover -s skills/principles-bitter-lesson/tests
      - run: pip install pyyaml
      - run: python3 -c "import glob,yaml,sys; bad=[f for f in glob.glob('skills/*/SKILL.md') if not isinstance(yaml.safe_load(open(f).read().split('---',2)[1]),dict)]; print(bad); sys.exit(1 if bad else 0)"
